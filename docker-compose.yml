# =============================================================================
# Cloud Computer — the machine your AI film studio and your agent run on
# =============================================================================
#
#   >>> CHANGE THE DESKTOP PASSWORD BEFORE ENABLING THE TUNNEL <<<
#
#       PASSWORD=CHANGE-ME-BEFORE-ENABLING-TUNNEL        <- put your own password here
#
#   The tunnel token stays a placeholder until you have created Access apps and
#   allow policies for both hostnames. Replace it to connect the tunnel while it
#   has no public hostname routes; add the routes only after the Access gate exists.
#
#   (Optional) CUSTOM_USER is the name you sign in with. "studio" is fine.
#
#   No ports are published. With the placeholder tunnel token, the connector is off.
#
# What this runs: one Linux desktop (XFCE, streamed to your browser) with the
# Cloudflare connector and this machine's own boot hooks inside it. It does NOT
# contain an agent: you install Hermes Agent yourself, from the desktop's own
# terminal, with Nous Research's installer — the install section of your guide
# walks through it (about 10 minutes, nothing to download to your own computer).
#
# Nothing is exposed on your server's public address: no ports are published.
# You reach the desktop through the address you set up yourself.
#
# First start, in order: the desktop comes up. It asks for your city the first
# time you sign in, and remembers it. Nothing installs itself in the background.
#
# Your data lives in the folders beside this file — ./config and ./shared. They
# sit on your server, not inside the container, so updating or rebuilding the
# container does not remove your agent, your conversations or your studio. Your
# agent's own home (its program, memory, skills and studio) is ./config/.hermes,
# created there the first time you install it.
#
# The clock is deliberately NOT set here: the first time you sign in to the
# desktop, the machine asks for your city and remembers the answer.

services:
  cloud:
    image: ghcr.io/aoio-design/aoiostudios-cloud-computer:latest
    container_name: cloud-computer
    restart: unless-stopped
    environment:
      - PUID=10000
      - PGID=10000
      # The name you sign in to the desktop with
      - CUSTOM_USER=studio
      # Change this password before enabling the tunnel.
      - PASSWORD=CHANGE-ME-BEFORE-ENABLING-TUNNEL
      - TITLE=Cloud Computer
      # Session-sharing links carry no authentication of their own and grant the
      # same power as the desktop login, so they stay switched off.
      - SELKIES_ENABLE_SHARING=false
      # Replace this run token after Access apps/policies exist, while no routes exist.
      # Add hostname routes only after this connector is healthy and the Access gate is ready.
      # This is a per-tunnel run token, not a Cloudflare API token.
      - CLOUDFLARE_TUNNEL_TOKEN=PASTE_YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE
    volumes:
      # The desktop's own settings and the desktop user's home folder. After you
      # install the agent, its home (./config/.hermes) lives in here too.
      - ./config:/config
      # A folder the desktop user and the agent can both read and write
      - ./shared:/shared
    # The desktop and the browser need more shared memory than the 64 MB default
    shm_size: 2gb
    # No ports are published, and no Docker socket is mounted: the desktop user
    # has sudo inside the container, so the screen is as powerful as root.
